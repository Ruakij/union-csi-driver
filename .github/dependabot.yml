version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released in lockstep; they do not compile against mismatched versions.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]
    ignore:
      # GO-2026-6443 (server panic on missing authority), fixed after v1.84.0.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /hack
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
