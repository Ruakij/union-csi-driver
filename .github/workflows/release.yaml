name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Spelled out rather than left to the default so it stays in lockstep with the
      # appVersion the chart job stamps; a mismatch there is an ImagePullBackOff.
      # major.minor and latest are skipped for prereleases by the action itself.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: version=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Both publishing routes run off the same tag so the repo index and the OCI
  # registry cannot drift apart.
  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      # The tag is the single source of truth. Without this the chart would ship
      # an appVersion, and therefore a default image tag, that was never pushed.
      - name: Stamp the chart with the tag
        run: |
          # Helm rejects a v prefix on version; appVersion keeps it because that is
          # the image tag.
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${version}/" charts/union-csi-driver/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"v${version}\"/" charts/union-csi-driver/Chart.yaml
          helm lint charts/union-csi-driver
      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      # Prereleases go to the OCI registry only: the index on gh-pages is what
      # `helm repo add` resolves, and it should list stable versions.
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # OCI references must be lowercase, and the owner login is not.
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
          helm package charts/union-csi-driver -d dist
          helm push dist/union-csi-driver-*.tgz "oci://ghcr.io/${owner}/charts"
