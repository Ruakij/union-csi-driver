# Two versions live in files Dependabot cannot parse: the mergerfs release asset
# pinned by sha256 in hack/mergerfs.pin, and the golangci-lint version in
# hack/golangci-lint.version. This bumps them and opens a PR.
#
# AUTOMATION_SSH_KEY is an optional repository secret holding the private half of a
# deploy key with write access. With it, the branch is pushed over SSH rather than as
# GITHUB_TOKEN, which is what lets ci.yaml run on the automation/** push. Without it
# checkout falls back to the token and the PR opens with no checks.
name: upstream-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  mergerfs:
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-sync-mergerfs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version=//p' hack/mergerfs.pin)
          latest=$(gh release view --repo trapexit/mergerfs --json tagName -q .tagName)
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          [ "${current}" = "${latest}" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Rewrites the version and re-downloads both arch tarballs to hash them.
      - if: steps.detect.outputs.changed == 'true'
        run: make update-mergerfs MERGERFS_VERSION=${{ steps.detect.outputs.latest }}

      - if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_PR_TOKEN != '' && secrets.AUTOMATION_PR_TOKEN || github.token }}
          branch: automation/mergerfs-version-sync
          delete-branch: true
          commit-message: "Bump mergerfs to ${{ steps.detect.outputs.latest }}"
          title: "Bump mergerfs to ${{ steps.detect.outputs.latest }}"
          body: |
            Automated mergerfs upstream sync.

            - Previous: `${{ steps.detect.outputs.current }}`
            - New: `${{ steps.detect.outputs.latest }}`

            `hack/mergerfs.pin` carries the version and the amd64/arm64 sha256 digests,
            regenerated by `make update-mergerfs`. The image build verifies the tarballs
            against those digests, so a bad fetch shows up in the `image` job below.

  golangci-lint:
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-sync-golangci-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(cat hack/golangci-lint.version)
          latest=$(gh release view --repo golangci/golangci-lint --json tagName -q .tagName)
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          [ "${current}" = "${latest}" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.changed == 'true'
        run: echo "${{ steps.detect.outputs.latest }}" > hack/golangci-lint.version

      # A new release usually means new checks, so let the PR say whether we pass.
      - if: steps.detect.outputs.changed == 'true'
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.detect.outputs.latest }}

      - if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_PR_TOKEN != '' && secrets.AUTOMATION_PR_TOKEN || github.token }}
          branch: automation/golangci-lint-version-sync
          delete-branch: true
          commit-message: "Bump golangci-lint to ${{ steps.detect.outputs.latest }}"
          title: "Bump golangci-lint to ${{ steps.detect.outputs.latest }}"
          body: |
            Automated golangci-lint upstream sync.

            - Previous: `${{ steps.detect.outputs.current }}`
            - New: `${{ steps.detect.outputs.latest }}`

            Result of running the new version against the tree: `${{ steps.lint.outcome }}`.
            A failure here is expected when a release adds checks; the findings are in the
            job log of the run that opened this PR.
