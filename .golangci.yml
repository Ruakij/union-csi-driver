version: "2"

run:
  # Mount-level and e2e tests are linted too, even though only their own CI jobs run them.
  build-tags: [mounttest, e2e]

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - nilerr
    - rowserrcheck
    - unconvert
    - wastedassign
    - revive
  settings:
    revive:
      rules:
        - name: unused-parameter
  exclusions:
    presets:
      # Close and os.Remove on cleanup paths, with nothing to report the error to.
      - std-error-handling
