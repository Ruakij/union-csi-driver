{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "union-csi-driver.fullname" . }}
  labels:
    {{- include "union-csi-driver.labels" . | nindent 4 }}
rules:
  # Read-only: the driver looks up the publishing pod to map sourceVolumes names
  # to node paths. It never writes cluster state.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "union-csi-driver.fullname" . }}
  labels:
    {{- include "union-csi-driver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "union-csi-driver.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "union-csi-driver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
