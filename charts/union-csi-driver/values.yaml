# Merge backend to run on this release. One backend per release; installing both
# means installing the chart twice with different backend and driverName values.
backend: mergerfs # or: overlay

# Defaults to "{{ .Values.backend }}.csi.ruekov.eu". This is the name pods put in
# volumes[].csi.driver.
driverName: ""

image:
  repository: ghcr.io/ruakij/union-csi-driver
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  # Sidecars take every restriction except runAsNonRoot: the images run as root
  # (USER 0) and the registrar creates its socket in, and the probe connects to the
  # driver socket in, root-owned hostPath directories. A non-root run would need
  # runAsUser/runAsGroup plus a matching mode on those directories.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

# Sidecar serving /healthz for the driver container's liveness probe, by calling
# the driver's CSI Probe over its socket.
livenessProbe:
  image:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.20.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  # Same restrictions and exception as the registrar.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

# Presets: k3s and RKE2 use /var/lib/kubelet by default but k3s installs that as a
# symlink to /var/lib/rancher/k3s/agent/kubelet; MicroK8s uses
# /var/snap/microk8s/common/var/lib/kubelet.
kubeletRootDir: /var/lib/kubelet

# Host directories hostPath sources (pod volumes and hostPath PVs) may come from.
# Only these are mounted into the driver container, under mountDir. Empty disables
# hostPath sources; [/] allows the whole host. denied applies below the allowed
# directories, also after resolving symlinks; kubeletRootDir is always denied.
hostPaths:
  allowed: []
  denied:
    - /proc
    - /sys
    - /dev
    - /boot
    - /etc
    - /root
    - /run
    - /var/run
    - /var/lib/containerd
    - /var/lib/docker
    - /var/lib/etcd
    - /var/lib/rancher/k3s/agent
    - /var/lib/rancher/k3s/server
    - /var/lib/rancher/rke2/agent
    - /var/lib/rancher/rke2/server
    - /var/log
  mountDir: /host

publishTimeout: 30s
maxSourceVolumes: 32
# Mounts a union declared several times in one pod once, and binds that mount
# for the other volumes. false gives each volume its own mount.
reuseMounts: true

options:
  allowlist: "" # empty: any schema-known option that is not denied
  denylist: "" # empty: backend default
  denylistMode: refuse # refuse | strip
  defaults: "" # empty: backend default
  forced: ""

mergerfs:
  # auto: mount /run/systemd and let the driver probe for it, falling back to a
  # reconcile loop. systemd: same mounts, but the node is expected to have it.
  # in-container: never mount /run/systemd; daemons die with the driver pod and
  # are remounted by the reconcile loop.
  daemonLifetime: auto # auto | systemd | in-container
  # Run each daemon in an empty root holding only its branches and target, so
  # nothing it is tricked into following leads elsewhere. Needs Linux 5.12+.
  sandbox: true
  # Bind each union's .mergerfs control file read-only over itself. Without it,
  # root in any consumer container can reconfigure the union through xattrs.
  sealControlFile: true

# Mount every source volume no container mounts read-only into the first container
# mounting its union, under /.union-csi/sources/<volume>, so kubelet sets it up. Applied at pod
# admission by a MutatingAdmissionPolicy, so only on clusters serving
# admissionregistration.k8s.io/v1 MutatingAdmissionPolicy; elsewhere such pods fail
# to mount with an error naming the unmounted source.
autoMountSources: true

logLevel: 2

rbac:
  create: true
serviceAccount:
  create: true
  name: ""

priorityClassName: system-node-critical
# A node agent belongs on every node.
tolerations:
  - operator: Exists
nodeSelector: {}
affinity: {}
# Requests only: a throttled or OOM-killed driver stalls every union mount on the
# node, and without host systemd the mergerfs daemons share this container's cgroup.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
# Pod level, so it applies to all three containers. runAsNonRoot is not set: the
# driver runs as root to mount and the sidecar images run as root as well.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
# Driver container. The kernel mount and unmount calls need CAP_SYS_ADMIN and, for
# mergerfs, /dev/fuse (a hostPath mount, which a device plugin or a CDI device
# could replace). privileged also lifts the runtime seccomp profile and the
# capability drop, and is incompatible with allowPrivilegeEscalation: false, so
# neither is set here. The root filesystem is read-only; per-volume state lives in
# a hostPath below the kubelet plugins directory.
# Narrower set, untested: capabilities [SYS_ADMIN] instead of privileged, the
# /dev/fuse device from a device plugin, allowPrivilegeEscalation: false, and
# whatever else the mergerfs sandbox (namespaces, pivot_root) needs. Blocker: the
# API server only admits mountPropagation: Bidirectional on privileged containers,
# which the pods-dir and plugins-dir mounts use, so this needs another way to
# propagate the union mount back to kubelet.
securityContext:
  privileged: true
  readOnlyRootFilesystem: true
# The driver reads pods, PVCs and PVs through the API (see rbac.yaml), so the
# token must be mounted. The sidecars share it though they never use it; giving
# it to the driver container alone needs a projected volume mounted there only.
automountServiceAccountToken: true
podAnnotations: {}
podLabels: {}
updateStrategy:
  type: RollingUpdate
